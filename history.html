<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ProjScope - History</title>
  <style>
    /* Reset and base styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      margin: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #f5f6fa;
      min-height: 100vh;
      padding-bottom: 60px; /* Space for footer */
    }

    /* Responsive header */
    header { 
      background: linear-gradient(90deg,#1a73e8,#d32f2f); 
      color: white; 
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-section img {
      height: 40px;
      width: auto;
      border-radius: 4px;
    }

    /* Container styles */
    .container { 
      max-width: 900px; 
      margin: 1rem auto; 
      background: white; 
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.08);
      margin-bottom: 2rem;
    }

    /* History item styles */
    .item { 
      padding: 1rem;
      border-bottom: 1px solid #eee;
      transition: background-color 0.2s;
    }

    .item:hover {
      background-color: #f8f9fa;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .meta { 
      font-size: 0.875rem;
      color: #777;
    }

    /* Navigation styles */
    nav a {
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
      transition: background 0.2s;
    }

    nav a:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Footer styles */
    footer { 
      text-align: center; 
      padding: 1rem;
      background: #1a73e8; 
      color: white;
      position: fixed;
      bottom: 0;
      width: 100%;
      font-size: 0.875rem;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .container {
        margin: 1rem;
        padding: 1rem;
      }

      .item {
        padding: 0.75rem;
      }

      .header-content {
        justify-content: center;
        text-align: center;
      }

      h1 {
        font-size: 1.5rem;
      }

      .item-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 480px) {
      .logo-section img {
        height: 30px;
      }

      h1 {
        font-size: 1.25rem;
      }

      .container {
        margin: 0.5rem;
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo-section">
        <img src="images/mitslogo.png" alt="MITS Logo" onerror="this.style.display='none'">
        <h1>Analysis History</h1>
      </div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <h2>Your Previous Analyses</h2>
    <div id="historyList">
      <p class="meta">Loading...</p>
    </div>
  </div>

  <footer>© 2025 MITS | Developed by Zero Requeim, MITS Artificial Intelligence</footer>

  <script>
    function getCurrentUser(){
      const roll = localStorage.getItem('projscope_current');
      if(!roll) return null;
      const users = JSON.parse(localStorage.getItem('projscope_users')||'[]');
      return users.find(u=>u.roll===roll) || null;
    }

    (function init(){
      const user = getCurrentUser();
      if(!user) { window.location.href = 'index.html'; return; }
      const key = `projscope_history_${user.roll}`;
      const arr = JSON.parse(localStorage.getItem(key) || '[]');
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      if(arr.length === 0){
        list.innerHTML = '<p class="meta">No analyses found yet. Try analyzing a few ideas on the dashboard.</p>';
        return;
      }
      // Update the history item creation
      for(const rec of arr){
        const d = document.createElement('div');
        d.className = 'item';
        const time = new Date(rec.timestamp).toLocaleString();
        d.innerHTML = `
          <div class="item-header">
            <strong>${rec.idea}</strong>
            <span class="meta">${time}</span>
          </div>
          <div class="meta">
            Result: ${rec.result} 
            ${rec.matched && rec.matched.length ? 
              ('<br>Matched: ' + rec.matched.map(m=>m.title).join(', ')) : 
              ''}
          </div>`;
        list.appendChild(d);
      }
    })();
  </script>
</body>
</html>
